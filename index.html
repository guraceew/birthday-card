<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Letter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <div class="sparkle sparkle-1">✦</div>
    <div class="sparkle sparkle-2">✧</div>
    <div class="sparkle sparkle-3">✦</div>
    <div class="sparkle sparkle-4">✧</div>

    <h1 class="birthday-title">Happy 20th Birthday ✦</h1>
  

    <div class="scene">
      <img src="smiski-sleeping.png" class="smiski smiski-sleeping" alt="Sleeping Smiski">
      <img src="smiski-hbd.png" class="smiski smiski-hbd" alt="Birthday Smiskis">
      <img src="smiski-lounging.png" class="smiski smiski-lounging" alt="Lounging Smiski">
      <img src="smiski-working.png" class="smiski smiski-working" alt="Weightlifting Smiski">

      <div class="envelope-wrapper" id="envelope">
        <div class="envelope">
          <div class="letter">
            <img src="daniel-birthday-letter.jpg" alt="Handwritten birthday letter">
          </div>

          <div class="back"></div>
          <div class="front-left"></div>
          <div class="front-right"></div>
          <div class="front-bottom"></div>
          <div class="flap"></div>
          <div class="seal">✦</div>
        </div>
      </div>
    </div>

    <button id="instruction">Open Letter ✦</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
